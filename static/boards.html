<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meus quadros | Quadro Kanban</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="stylesheet" href="/static/styles.css?v=3">
  <link rel="stylesheet" href="/static/extra.css?v=3">
</head>
<body class="list-page boards-page">
  <header class="board-header">
    <div class="board-brand">
      <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M10.5 7v18" stroke="#fff" stroke-width="3.4"/><path d="M14.5 16 22 8.5" stroke="#fff" stroke-width="3.4"/><path d="M14.5 16 22 23.5" stroke="#c4b5fd" stroke-width="3.4"/><circle cx="24.5" cy="6" r="1.6" fill="#c4b5fd" stroke="none"/></svg></span>
      <div class="board-titles"><div class="project-name" style="cursor:default">Meus quadros</div><div class="board-subtitle" id="greet">Crie quadros e acesse os que foram compartilhados com você.</div></div>
    </div>
    <div class="head-actions"><div class="account-menu" style="border:0;margin:0;padding:0"><span class="account-avatar" id="avatar"></span><span class="account-email" id="accName"></span><button class="logout-button" id="logout" type="button">Sair</button></div></div>
  </header>
  <main class="list-main">
    <section class="stats" aria-label="Resumo">
      <div class="stat s-blue"><span class="stat-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M9 4v16M15 4v10"/></svg></span><div><b id="stBoards">0</b><span>Quadros</span></div></div>
      <div class="stat s-green"><span class="stat-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="m8.5 12 2.5 2.5 4.5-5"/></svg></span><div><b id="stTasks">0</b><span>Tarefas no total</span></div></div>
      <div class="stat s-purple"><span class="stat-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6M17 5.5a3.5 3.5 0 0 1 0 6.5M18.5 14.4c2 .7 3.5 2.6 3.5 5.6"/></svg></span><div><b id="stShared">0</b><span>Compartilhados comigo</span></div></div>
      <div class="stat s-pink"><span class="stat-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.5 6.6 19.5l1.2-6L3.3 9.3l6.1-.7z"/></svg></span><div><b id="stOwner">0</b><span>Sou dono</span></div></div>
    </section>
    <form class="new-board" id="newBoardForm"><input id="newBoardName" maxlength="60" placeholder="Nome do novo quadro" aria-label="Nome do novo quadro"><button class="btn btn-primary" type="submit">+ Criar quadro</button></form>
    <div class="section-title st-mine"><span class="st-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M9 4v16M15 4v10"/></svg></span>Meus quadros <small id="mineCount"></small></div>
    <div class="board-grid" id="mine"></div>
    <div class="section-title st-shared"><span class="st-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6M17 5.5a3.5 3.5 0 0 1 0 6.5M18.5 14.4c2 .7 3.5 2.6 3.5 5.6"/></svg></span>Compartilhados comigo <small id="sharedCount"></small></div>
    <div class="board-grid" id="shared"></div>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <script src="/static/api.js"></script>
  <script src="/static/boards.js?v=3"></script>
</body>
</html>
